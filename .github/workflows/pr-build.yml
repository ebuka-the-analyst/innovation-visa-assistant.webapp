name: PR Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate tool platform registry
        run: node scripts/validate-tool-platform-registry.cjs

      - name: Check tool platform runtime syntax
        run: |
          node --check server/toolPlatform.cjs
          node --check server/scripts/preflight-app-schema.cjs
          node --check server/scripts/verify-app-schema.cjs

      - name: Smoke test tool platform routes
        run: node scripts/smoke-tool-platform-routes.cjs

      - name: Production build
        run: npm run build
