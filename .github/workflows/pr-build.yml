name: PR Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate tool platform registry
        run: node scripts/validate-tool-platform-registry.cjs

      - name: Check production runtime syntax
        run: |
          node --check server/toolPlatform.cjs
          node --check server/eligibilityPolicy.cjs
          node --check server/eligibilityPolicySafety.cjs
          node --check server/eligibilityEngine.cjs
          node --check server/ivsPolicy.cjs
          node --check server/ivsEngine.cjs
          node --check server/financialModelPolicy.cjs
          node --check server/financialModelEngine.cjs
          node --check server/scripts/preflight-app-schema.cjs
          node --check server/scripts/verify-app-schema.cjs

      - name: Test eligibility policy
        run: node scripts/test-eligibility-policy.cjs

      - name: Test eligibility policy safety reconciliation
        run: node scripts/test-eligibility-policy-safety.cjs

      - name: Test IVS policy
        run: node scripts/test-ivs-policy.cjs

      - name: Test financial model policy
        run: node scripts/test-financial-model-policy.cjs

      - name: Smoke test tool platform routes
        run: node scripts/smoke-tool-platform-routes.cjs

      - name: Smoke test eligibility route
        run: node scripts/smoke-eligibility-route.cjs

      - name: Smoke test IVS route
        run: node scripts/smoke-ivs-route.cjs

      - name: Smoke test financial model route
        run: node scripts/smoke-financial-model-route.cjs

      - name: Validate business plan revision foundation
        run: node scripts/validate-revision-foundation.cjs

      - name: Validate business plan Revision Centre
        run: node scripts/validate-revision-centre.cjs

      - name: Validate Admin Revision Queue
        run: node scripts/validate-admin-revision-queue.cjs

      - name: Production build
        run: npm run build
