name: PR Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit hardcoded values
        run: node scripts/audit-hardcoded-values.cjs

      - name: Validate tool platform registry
        run: node scripts/validate-tool-platform-registry.cjs

      - name: Check production runtime syntax
        run: |
          node --check server/aiGatewayPreload.cjs
          node --check server/founderPortfolio.cjs
          node --check server/progressTracker.cjs
          node --check server/toolPlatform.cjs
          node --check server/applicationContextPrefill.cjs
          node --check server/questionnaireDraftSync.cjs
          node --check server/eligibilityPolicy.cjs
          node --check server/eligibilityPolicySafety.cjs
          node --check server/eligibilityEngine.cjs
          node --check server/ivsPolicy.cjs
          node --check server/ivsEngine.cjs
          node --check server/financialModelPolicy.cjs
          node --check server/financialModelEngine.cjs
          node --check server/scripts/preflight-app-schema.cjs
          node --check server/scripts/verify-app-schema.cjs

      - name: Test eligibility policy
        run: node scripts/test-eligibility-policy.cjs

      - name: Test eligibility policy safety reconciliation
        run: node scripts/test-eligibility-policy-safety.cjs

      - name: Test IVS policy
        run: node scripts/test-ivs-policy.cjs

      - name: Test financial model policy
        run: node scripts/test-financial-model-policy.cjs

      - name: Smoke test tool platform routes
        run: node scripts/smoke-tool-platform-routes.cjs

      - name: Smoke test eligibility route
        run: node scripts/smoke-eligibility-route.cjs

      - name: Smoke test IVS route
        run: node scripts/smoke-ivs-route.cjs

      - name: Smoke test financial model route
        run: node scripts/smoke-financial-model-route.cjs

      - name: Validate application context autofill
        run: node scripts/validate-application-context-prefill.cjs

      - name: Validate business plan revision foundation
        run: node scripts/validate-revision-foundation.cjs

      - name: Validate business plan Revision Centre
        run: node scripts/validate-revision-centre.cjs

      - name: Validate Admin Revision Queue
        run: node scripts/validate-admin-revision-queue.cjs

      - name: Validate progress tracker plan link
        run: node scripts/validate-progress-tracker-plan-link.cjs

      - name: Validate evidence-aware Progress Tracker
        run: node scripts/validate-evidence-aware-progress-tracker.cjs

      - name: Validate application document workspace
        run: node scripts/validate-application-document-workspace.cjs

      - name: Validate founder portfolio account sync
        run: node scripts/validate-founder-portfolio-sync.cjs

      - name: Validate account-synced Pitch Coach
        run: node scripts/validate-pitch-coach-v2.cjs

      - name: Validate account-synced Final Document Review
        run: node scripts/validate-account-synced-final-document-review.cjs

      - name: Validate large Final Document Review
        run: node scripts/validate-large-final-document-review.cjs

      - name: Prepare managed AI routing
        run: |
          node scripts/prepare-managed-ai-routing.cjs
          node scripts/prepare-managed-ai-routing-extra.cjs

      - name: Validate transparent Final Document Review waiting UX
        run: node scripts/validate-document-review-wait-ux.cjs

      - name: Validate managed AI provider policy
        run: node scripts/validate-ai-provider-policy.cjs

      - name: Validate account-synced final route checklist
        run: node scripts/validate-compliance-checker-v2.cjs

      - name: Production build
        run: npm run build
