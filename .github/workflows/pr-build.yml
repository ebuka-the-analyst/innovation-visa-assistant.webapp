name: PR Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Upload source snapshot for controlled refactor
        uses: actions/upload-artifact@v4
        with:
          name: durable-generation-source-snapshot
          path: |
            server/routes.ts
            server/index.ts
            server/db.ts
            shared/schema.ts
          if-no-files-found: error
          retention-days: 1
