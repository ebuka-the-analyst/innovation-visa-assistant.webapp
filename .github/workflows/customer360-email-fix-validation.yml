name: Customer 360 Email Fix Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check Customer 360 email fix
        run: |
          cat > .customer360-fix-tsconfig.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "include": [
              "client/src/components/admin/customer360DialogBridge.ts",
              "client/src/main.tsx"
            ],
            "exclude": [],
            "compilerOptions": {
              "target": "ES2020",
              "noEmit": true
            }
          }
          JSON
          npx tsc -p .customer360-fix-tsconfig.json

      - name: Production build
        run: npm run build
