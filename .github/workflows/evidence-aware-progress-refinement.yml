name: Evidence-aware Progress Refinement

on:
  push:
    branches:
      - feature/evidence-aware-progress-tracker
    paths:
      - scripts/refine-evidence-aware-progress-tracker.cjs
      - .github/workflows/evidence-aware-progress-refinement.yml

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, 'Apply final tracker evidence refinement') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/evidence-aware-progress-tracker
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply final refinement
        run: node scripts/refine-evidence-aware-progress-tracker.cjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate evidence-aware tracker
        run: node scripts/validate-evidence-aware-progress-tracker.cjs

      - name: Validate existing tracker schema contract
        run: node scripts/validate-progress-tracker-plan-link.cjs

      - name: Check server syntax
        run: node --check server/progressTracker.cjs

      - name: Production build
        run: npm run build

      - name: Commit validated refinement
        shell: bash
        run: |
          if git diff --quiet -- client/src/pages/progress.tsx; then
            echo "No tracker refinement changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/progress.tsx
          git commit -m "Apply final tracker evidence refinement"
          git push origin HEAD:feature/evidence-aware-progress-tracker
