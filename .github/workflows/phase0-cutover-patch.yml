name: Phase-0 cutover patch

on:
  push:
    branches:
      - security/phase0-auth-migration-hardening

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: security/phase0-auth-migration-hardening
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply source cutover edits
        shell: python
        run: |
          from pathlib import Path
          import re

          index_path = Path('server/index.ts')
          text = index_path.read_text(encoding='utf-8')

          dispute = re.compile(
              r'\n  // Internal dispute evidence document — served directly for reliability across environments\n'
              r'  app\.get\("/dispute-evidence", \(req, res\) => \{.*?\n  \}\);\n',
              re.S,
          )
          text, dispute_count = dispute.subn('\n', text, count=1)
          if dispute_count != 1:
              raise SystemExit(f'Expected to remove exactly one dispute-evidence route, removed {dispute_count}')

          runtime_migration = re.compile(
              r'\n// Auto-migration for production database schema updates\n'
              r'async function runAutoMigrations\(\) \{.*?\n\}\n\n(?=\(async \(\) => \{)',
              re.S,
          )
          text, migration_count = runtime_migration.subn('\n', text, count=1)
          if migration_count != 1:
              raise SystemExit(f'Expected to remove exactly one runAutoMigrations function, removed {migration_count}')

          startup_call = '  // Run auto-migrations before starting server\n  await runAutoMigrations();\n  \n'
          if startup_call not in text:
              raise SystemExit('runAutoMigrations startup call not found')
          text = text.replace(startup_call, '', 1)
          index_path.write_text(text, encoding='utf-8')

          schema_path = Path('shared/schema.ts')
          schema = schema_path.read_text(encoding='utf-8')
          block_start = schema.index('export const apiLatencyLog = pgTable("api_latency_log", {')
          block_end = schema.index('// Plan Section Analytics', block_start)
          block = schema[block_start:block_end]
          old_fk = 'userId: varchar("user_id").references(() => users.id),'
          new_fk = 'userId: varchar("user_id").references(() => users.id, { onDelete: "set null" }),' 
          if old_fk not in block:
              raise SystemExit('Expected apiLatencyLog user FK declaration not found')
          block = block.replace(old_fk, new_fk, 1)
          schema = schema[:block_start] + block + schema[block_end:]
          schema_path.write_text(schema, encoding='utf-8')

          legacy = Path('scripts/db-migrate.js')
          if not legacy.exists():
              raise SystemExit('Legacy scripts/db-migrate.js was expected to exist before cutover')
          legacy.unlink()

      - name: Validate migration scripts
        run: |
          node --check server/retiredRouteGuard.cjs
          node --check server/securityStartupGuard.cjs
          node --check server/creditReconciliationReset.cjs
          node --check server/scripts/phase0-db-preflight.cjs
          node --check server/scripts/phase0-startup-bootstrap-preflight.cjs
          node --check server/scripts/apply-phase0-db-migration.cjs
          node --check server/scripts/verify-phase0-db-migration.cjs
          node --check server/scripts/verify-phase0-startup-bootstrap.cjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Commit validated cutover
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.ts shared/schema.ts scripts/db-migrate.js
          if git diff --cached --quiet; then
            echo "No source cutover changes to commit"
            exit 0
          fi
          git commit -m "security: cut over from startup database mutations"
          git push origin HEAD:security/phase0-auth-migration-hardening
