name: Customer 360 Timezone Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check runtime module syntax
        run: |
          node --check server/customer360LocationContext.cjs
          node --check server/retiredRouteGuard.cjs

      - name: Verify Customer 360 middleware ordering
        run: |
          NODE_ENV=development node <<'NODE'
          require('./server/customer360Admin.cjs');
          require('./server/customer360LocationContext.cjs');
          const express = require('express');
          const app = express();
          app.get('/validation-dummy', (_req, res) => res.send('ok'));
          const stack = app._router?.stack || [];
          const contextIndex = stack.findIndex((layer) => layer.handle?.name === 'customer360LocationContextMiddleware');
          const customer360Index = stack.findIndex((layer) => layer.route?.path === '/api/admin/customer-360');
          if (contextIndex < 0) throw new Error('Timezone context middleware was not registered');
          if (customer360Index < 0) throw new Error('Customer 360 route was not registered');
          if (contextIndex >= customer360Index) throw new Error(`Timezone middleware must precede Customer 360 route (${contextIndex} >= ${customer360Index})`);
          console.log(`Middleware ordering verified: ${contextIndex} < ${customer360Index}`);
          NODE

      - name: Production build
        run: npm run build
