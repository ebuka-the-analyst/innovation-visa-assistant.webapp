name: Phase 2 Real Isolated Staging HTTP E2E
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-real-staging:
    if: ${{ github.event.pull_request.number == 116 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify owner sign-in and actual PDF + Word from isolated staging
        run: node scripts/phase2-staging-live-e2e.mjs
