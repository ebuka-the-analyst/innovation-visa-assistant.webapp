name: Admin Revision Queue Builder

on:
  push:
    branches:
      - feat/production-admin-revision-queue
    paths:
      - scripts/patch-admin-revision-queue-wiring.cjs
      - .github/workflows/admin-revision-queue-builder.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Admin Revision Queue wiring') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/production-admin-revision-queue
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic admin queue patch
        run: node scripts/patch-admin-revision-queue-wiring.cjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Admin Revision Queue
        run: node scripts/validate-admin-revision-queue.cjs

      - name: Production build
        run: npm run build

      - name: Commit validated source changes
        shell: bash
        run: |
          if git diff --quiet -- server/index.ts client/src/components/AdminSidebar.tsx client/src/pages/admin-dashboard.tsx; then
            echo "Admin Revision Queue already wired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.ts client/src/components/AdminSidebar.tsx client/src/pages/admin-dashboard.tsx
          git commit -m "Apply Admin Revision Queue wiring"
          git push origin HEAD:feat/production-admin-revision-queue
