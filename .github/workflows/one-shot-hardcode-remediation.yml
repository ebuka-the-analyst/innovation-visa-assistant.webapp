name: One-shot hardcode remediation

on:
  push:
    branches:
      - hardcode-remediation-all-20260819

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v4
        with:
          ref: hardcode-remediation-all-20260819
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply hardcode remediation
        run: node scripts/remediate-unsafe-hardcodes.cjs

      - name: Type check
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Remove one-shot remediation scaffolding
        run: |
          rm -f scripts/remediate-unsafe-hardcodes.cjs
          rm -f .github/workflows/one-shot-hardcode-remediation.yml

      - name: Commit remediated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Remove unsafe hardcoded runtime data" || exit 0
          git push origin HEAD:hardcode-remediation-all-20260819
