name: Progress Tracker Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check progress tracker server syntax
        run: |
          node --check server/progressTracker.cjs
          node --check server/retiredRouteGuard.cjs

      - name: Verify tracker routes register
        run: |
          NODE_ENV=development node <<'NODE'
          require('./server/retiredRouteGuard.cjs');
          const express = require('express');
          const app = express();
          app.use(express.json());
          app.get('/validation-dummy', (_req, res) => res.send('ok'));
          app.post('/validation-dummy', (_req, res) => res.send('ok'));
          const stack = app._router?.stack || [];
          const getTracker = stack.find((layer) => layer.route?.path === '/api/progress-tracker' && layer.route?.methods?.get);
          const postTracker = stack.find((layer) => layer.route?.path === '/api/progress-tracker/steps/:stepId' && layer.route?.methods?.post);
          if (!getTracker) throw new Error('GET /api/progress-tracker was not registered');
          if (!postTracker) throw new Error('POST /api/progress-tracker/steps/:stepId was not registered');
          console.log('Progress tracker routes registered successfully');
          NODE

      - name: Type-check Progress Tracker page
        run: |
          cat > .progress-tsconfig.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "include": ["client/src/pages/progress.tsx"],
            "exclude": [],
            "compilerOptions": { "target": "ES2020", "noEmit": true }
          }
          JSON
          npx tsc -p .progress-tsconfig.json

      - name: Production build
        run: npm run build
