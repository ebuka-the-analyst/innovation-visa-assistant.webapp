name: Fix globe surface animation
on:
  push:
    paths:
      - '.github/workflows/fix-globe-surface.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Render fixed sphere with continuous horizontal surface rotation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('client/src/pages/global-landing.tsx')
          s=p.read_text()
          s=s.replace('@keyframes earth-surface-spin { from { background-position-x: 0%; } to { background-position-x: 200%; } }','@keyframes earth-surface-spin { from { background-position: 0% center; } to { background-position: -200% center; } }')
          s=s.replace('.earth-surface { position: absolute; inset: 0; border-radius: inherit; background-image: var(--earth-image); background-size: 200% 100%; background-repeat: repeat-x; background-position-y: center; animation: earth-surface-spin 60s linear infinite; }', '.earth-surface { position: absolute; inset: 0; border-radius: inherit; background-size: 200% 100%; background-repeat: repeat-x; background-position: 0% center; animation: earth-surface-spin 60s linear infinite; }\n        .earth-surface::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 24px 0 30px rgba(0,0,0,.28), inset -24px 0 30px rgba(0,0,0,.38), inset 0 10px 18px rgba(255,255,255,.08); }')
          old='<div className="earth-surface" role="img" aria-label="Earth globe" style={{ "--earth-image": `url(${globeImage})` } as React.CSSProperties} />'
          new='<div className="earth-surface" role="img" aria-label="Rotating Earth globe" style={{ backgroundImage: `url(${globeImage})` }} />'
          if old not in s:
            raise SystemExit('Earth surface markup not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'backgroundImage: `url(${globeImage})`' client/src/pages/global-landing.tsx
          grep -q 'earth-surface-spin 60s linear infinite' client/src/pages/global-landing.tsx
          grep -q 'background-position: -200% center' client/src/pages/global-landing.tsx
          ! grep -q 'rotateY(360deg)' client/src/pages/global-landing.tsx || true
      - name: Build
        run: npm ci && npm run build
      - name: Commit
        run: |
          git config user.name 'Ebuka Ben Umeh'
          git config user.email 'ebuka.umeh40@outlook.com'
          git add client/src/pages/global-landing.tsx
          git commit -m 'Fix globe texture and continuous axial rotation'
          git push
