name: Apply Visa Assistant brand

on:
  push:
    paths:
      - ".github/workflows/apply-visa-assistant-brand.yml"

permissions:
  contents: write

jobs:
  apply-brand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Apply approved brand system
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"{label}: expected block not found in {path}")
              p.write_text(text.replace(old, new, 1))

          p = Path("client/src/pages/global-landing.tsx")
          text = p.read_text()
          if 'import VisaAssistantBrand from "@/components/VisaAssistantBrand";' not in text:
              anchor = 'import ThemeToggle from "@/components/ThemeToggle";'
              if anchor not in text:
                  raise SystemExit("Global landing import anchor not found")
              text = text.replace(anchor, anchor + '\nimport VisaAssistantBrand from "@/components/VisaAssistantBrand";', 1)
          old_global = '''            <div className="flex items-center gap-2">
              <Globe2 className="h-6 w-6 text-[#005EB8]" />
              <div>
                <h1 className="text-base font-bold leading-tight">Visa Assistant</h1>
                <p className="text-[10px] text-gray-500 dark:text-gray-400 leading-none">.global</p>
              </div>
            </div>'''
          new_global = '''            <VisaAssistantBrand compact />'''
          if old_global not in text:
              raise SystemExit("Global landing old brand block not found")
          p.write_text(text.replace(old_global, new_global, 1))

          p = Path("client/src/components/Header.tsx")
          text = p.read_text()
          text = text.replace('import logoLightImg from "@assets/official_logo.webp";\nimport logoDarkImg from "@assets/logo_dark.webp";\n', '')
          if 'import VisaAssistantBrand from "./VisaAssistantBrand";' not in text:
              anchor = 'import LanguageSelector from "./LanguageSelector";'
              if anchor not in text:
                  raise SystemExit("Header import anchor not found")
              text = text.replace(anchor, anchor + '\nimport VisaAssistantBrand from "./VisaAssistantBrand";', 1)
          old_header = '''            <div className="logo-container overflow-hidden flex items-center">
              <img src={logoLightImg} alt="UK Innovator Founder Visa Assistant" width="200" height="56" fetchPriority="high" className={`w-auto logo-light object-contain !mix-blend-normal !filter-none !opacity-100 transition-[height] duration-200 ease-out ${isScrolled ? 'h-12 md:h-14' : 'h-14 md:h-18'}`} />
              <img src={logoDarkImg} alt="UK Innovator Founder Visa Assistant" width="200" height="56" fetchPriority="high" className={`w-auto logo-dark object-contain !mix-blend-normal !filter-none !opacity-100 transition-[height] duration-200 ease-out ${isScrolled ? 'h-12 md:h-14' : 'h-14 md:h-18'}`} />
            </div>'''
          new_header = '''            <VisaAssistantBrand
              routeFlag="🇬🇧"
              routeLabel="UK Innovator Founder"
              compact={isScrolled}
            />'''
          if old_header not in text:
              raise SystemExit("Public Header old logo block not found")
          p.write_text(text.replace(old_header, new_header, 1))

          p = Path("client/src/components/AuthHeader.tsx")
          text = p.read_text()
          text = text.replace('import logoLightImg from "@assets/official_logo.webp";\nimport logoDarkImg from "@assets/logo_dark.webp";\n', '')
          if 'import VisaAssistantBrand from "@/components/VisaAssistantBrand";' not in text:
              anchor = 'import ThemeToggle from "@/components/ThemeToggle";'
              if anchor not in text:
                  raise SystemExit("AuthHeader import anchor not found")
              text = text.replace(anchor, anchor + '\nimport VisaAssistantBrand from "@/components/VisaAssistantBrand";', 1)
          old_auth = '''                <div className="logo-container overflow-hidden flex items-center">
                  <img src={logoLightImg} alt="UK Innovator Founder Visa Assistant" className={`w-auto logo-light object-contain !mix-blend-normal !filter-none !opacity-100 transition-all duration-300 ${isScrolled ? 'h-16 md:h-20' : 'h-11 md:h-13'}`} />
                  <img src={logoDarkImg} alt="UK Innovator Founder Visa Assistant" className={`w-auto logo-dark object-contain !mix-blend-normal !filter-none !opacity-100 transition-all duration-300 ${isScrolled ? 'h-16 md:h-20' : 'h-11 md:h-13'}`} />
                </div>'''
          new_auth = '''                <VisaAssistantBrand
                  routeFlag="🇬🇧"
                  routeLabel="UK Innovator Founder"
                  compact={isScrolled}
                />'''
          if old_auth not in text:
              raise SystemExit("AuthHeader old logo block not found")
          p.write_text(text.replace(old_auth, new_auth, 1))

          p = Path("client/index.html")
          text = p.read_text()
          old_favicons = '''    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png?v=3" />
    <link rel="shortcut icon" href="/favicon.png?v=3" />'''
          new_favicons = '''    <link rel="icon" type="image/svg+xml" href="/visa-assistant-mark.svg?v=1" />
    <link rel="shortcut icon" href="/visa-assistant-mark.svg?v=1" />'''
          if old_favicons not in text:
              raise SystemExit("Index favicon block not found")
          text = text.replace(old_favicons, new_favicons, 1)
          text = text.replace('    <link rel="preload" href="/attached_assets/official_logo.webp" as="image" type="image/webp">\n', '')
          p.write_text(text)
          PY

      - name: Commit final brand update
        shell: bash
        run: |
          rm .github/workflows/apply-visa-assistant-brand.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adopt Visa Assistant parent brand across global and UK routes"
          git push
