name: Revision Centre Builder

on:
  push:
    branches:
      - feat/production-plan-revision-centre
    paths:
      - scripts/patch-revision-centre-wiring.cjs
      - .github/workflows/revision-centre-builder.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Revision Centre wiring') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/production-plan-revision-centre
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic Revision Centre patch
        run: node scripts/patch-revision-centre-wiring.cjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Revision Centre
        run: node scripts/validate-revision-centre.cjs

      - name: Production build
        run: npm run build

      - name: Commit validated source changes
        shell: bash
        run: |
          if git diff --quiet -- client/src/components/GenerationProgress.tsx server/services/businessPlanRevisionService.ts; then
            echo "Revision Centre already wired"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/components/GenerationProgress.tsx server/services/businessPlanRevisionService.ts
          git commit -m "Apply Revision Centre wiring"
          git push origin HEAD:feat/production-plan-revision-centre
