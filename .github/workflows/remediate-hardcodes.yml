name: Remediate Hardcoded Values

on:
  push:
    branches:
      - remediate-hardcoded-values

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ !contains(github.event.head_commit.message, '[skip-remediation]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply remediation codemod
        run: node scripts/remediate-hardcoded-values.cjs

      - name: Validate critical hardcodes
        run: node scripts/check-critical-hardcodes.cjs

      - name: Validate tool platform registry
        run: node scripts/validate-tool-platform-registry.cjs

      - name: Check production runtime syntax
        run: |
          node --check server/aiGatewayPreload.cjs
          node --check server/founderPortfolio.cjs
          node --check server/progressTracker.cjs
          node --check server/toolPlatform.cjs
          node --check server/applicationContextPrefill.cjs
          node --check server/questionnaireDraftSync.cjs
          node --check server/eligibilityPolicy.cjs
          node --check server/eligibilityPolicySafety.cjs
          node --check server/eligibilityEngine.cjs
          node --check server/ivsPolicy.cjs
          node --check server/ivsEngine.cjs
          node --check server/financialModelPolicy.cjs
          node --check server/financialModelEngine.cjs

      - name: Production build
        run: npm run build

      - name: Commit remediation
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No remediation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src server shared scripts
          git commit -m "Apply hardcoded-value remediation [skip-remediation]"
          git push origin HEAD:remediate-hardcoded-values
