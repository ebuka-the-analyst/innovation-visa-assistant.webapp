name: Isolated QA Stripe Checkout Acceptance
on:
  pull_request:
    branches:
      - phase2/premium-ai-entitlements-20261011
  push:
    branches:
      - qa/stripe-hosted-checkout-acceptance-20261012
permissions:
  contents: read
jobs:
  qa-acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ifva_qa_ci
          POSTGRES_USER: ifva_qa_ci
          POSTGRES_PASSWORD: isolated_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ifva_qa_ci -d ifva_qa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      QUOTA_TEST_DATABASE_URL: postgres://ifva_qa_ci:isolated_ci_only@localhost:5432/ifva_qa_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install application
        run: npm ci --no-audit --no-fund
      - name: Syntax-check strict QA seed and readiness scripts
        run: |
          node --check server/scripts/seed-qa-stripe-founders.cjs
          node --check server/scripts/check-qa-stripe-provider-readiness.cjs
      - name: Test staging-only page and login isolation
        run: node --import tsx --test tests/phase3-qa-hosted-checkout-page.test.ts
      - name: Regress original Stripe gateway and consent tests
        run: |
          node --import tsx --test tests/phase3-provider-test-gateway.test.ts
          node --import tsx --test tests/phase3-new-purchase-consent.test.ts
      - name: Validate lifecycle audit guard and access invariants
        run: |
          node --check server/scripts/audit-member-lifecycle-qa.cjs
          node --test tests/phase3-lifecycle-audit.test.cjs
      - name: Verify durable member entitlements against isolated PostgreSQL
        run: |
          node --import tsx --test tests/member-ai-quota.integration.test.ts
          node --import tsx --test tests/phase3-durable-stripe-test-ledger.integration.test.ts
          node --import tsx --test tests/phase3-qa-entitlement-fulfilment.integration.test.ts
      - name: Verify hard-gated production provider preflight
        run: |
          node --check server/scripts/check-live-membership-readiness.cjs
          node --test tests/phase3-live-readiness.test.cjs
      - name: Reject sandbox IDs in real Stripe live Checkout reservation
        run: node --import tsx --test tests/phase3-live-checkout-session.test.ts
      - name: Prevent catch-all HTTP 200 on disabled membership webhooks
        run: node --import tsx --test tests/phase3-live-disabled-routes.test.ts
      - name: Live gateway isolation and release-approval guards
        run: node --import tsx --test tests/phase3-live-payment-gate.test.ts
      - name: Live-format signed webhook lifecycle with disposable PostgreSQL
        run: node --import tsx --test tests/phase3-live-entitlement-fulfilment.integration.test.ts
      - name: Prepare build
        run: |
          node scripts/prepare-platform-trust-hardening.cjs
          node scripts/prepare-public-client-copy.cjs
          node scripts/prepare-server-public-seo.cjs
      - name: Build application
        run: npm run build
