name: Apply Branded Resilience Fixes

on:
  push:
    branches:
      - fix/branded-resilience-errors

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[resilience-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply resilience fixes
        run: node scripts/apply-resilience-fixes.cjs

      - name: Validate critical hardcodes
        run: node scripts/validate-critical-hardcodes.cjs

      - name: Production build
        run: npm run build

      - name: Commit validated fixes and remove temporary automation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/expert-booking.tsx server/index.ts railway.json
          git rm scripts/apply-resilience-fixes.cjs .github/workflows/apply-resilience-fixes.yml
          git commit -m "Fix branded resilience and Expert Booking crash [resilience-applied]"
          git push origin HEAD:fix/branded-resilience-errors
