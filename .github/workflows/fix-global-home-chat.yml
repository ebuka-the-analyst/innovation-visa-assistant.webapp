name: Fix global homepage and chatbot
on:
  push:
    paths:
      - '.github/workflows/fix-global-home-chat.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply axial Earth rotation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('client/src/pages/global-landing.tsx')
          s=p.read_text()
          s=s.replace('@keyframes earth-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }', '@keyframes earth-spin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }')
          s=s.replace('.globe img { animation: earth-spin 45s linear infinite; transform-origin: center; }', '.globe img { animation: earth-spin 45s linear infinite; transform-origin: center; transform-style: preserve-3d; backface-visibility: visible; }')
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -q 'rotateY(360deg)' client/src/pages/global-landing.tsx
          grep -q 'earth-spin 45s linear infinite' client/src/pages/global-landing.tsx
      - name: Build
        run: npm ci && npm run build
      - name: Commit
        run: |
          git config user.name 'Ebuka Ben Umeh'
          git config user.email 'ebuka.umeh40@outlook.com'
          git add client/src/pages/global-landing.tsx
          git commit -m 'Rotate homepage Earth around its axis'
          git push
