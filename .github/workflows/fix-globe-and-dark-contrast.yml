name: Fix globe and dark contrast
on:
  push:
    paths: ['.github/workflows/fix-globe-and-dark-contrast.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Fix globe texture and dark contrast
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('client/src/pages/global-landing.tsx')
          s=p.read_text()
          # Use two real image layers, translated horizontally inside a fixed circular mask.
          s=s.replace('@keyframes earth-surface-spin { from { background-position: 0% center; } to { background-position: -200% center; } }', '@keyframes earth-surface-spin { from { transform: translateX(0); } to { transform: translateX(-50%); } }')
          old='.earth-surface { position: absolute; inset: 0; border-radius: inherit; background-size: 200% 100%; background-repeat: repeat-x; background-position: 0% center; animation: earth-surface-spin 60s linear infinite; }\n        .earth-surface::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 24px 0 30px rgba(0,0,0,.28), inset -24px 0 30px rgba(0,0,0,.38), inset 0 10px 18px rgba(255,255,255,.08); }\n        .globe.zooming .earth-surface { animation: none; background-size: cover; background-position: center; }'
          new='.earth-track { position: absolute; inset: 0 auto 0 0; display: flex; width: 200%; height: 100%; animation: earth-surface-spin 60s linear infinite; }\n        .earth-track img { width: 50%; height: 100%; flex: 0 0 50%; object-fit: cover; }\n        .earth-shading { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 22px 0 30px rgba(0,0,0,.24), inset -22px 0 32px rgba(0,0,0,.34), inset 0 8px 16px rgba(255,255,255,.08); }\n        .globe.zooming .earth-track { animation: none; }'
          if old not in s: raise SystemExit('old earth CSS not found')
          s=s.replace(old,new)
          old_markup='<div className="earth-surface" role="img" aria-label="Rotating Earth globe" style={{ backgroundImage: `url(${globeImage})` }} />'
          new_markup='<div className="earth-track" role="img" aria-label="Rotating Earth globe"><img src={globeImage} alt="" draggable={false} /><img src={globeImage} alt="" draggable={false} /></div><div className="earth-shading" />'
          if old_markup not in s: raise SystemExit('old earth markup not found')
          s=s.replace(old_markup,new_markup,1)
          # Dark mode contrast: brighter secondary copy, chips, search, footer, and panel borders.
          s=s.replace('.dark .country-card { background: rgba(255,255,255,.05); border-color: rgba(255,255,255,.1); }', '.dark .country-card { background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.20); }')
          s=s.replace('.dark .glass-panel { background: rgba(255,255,255,.03); border-color: rgba(255,255,255,.08); }', '.dark .glass-panel { background: rgba(255,255,255,.055); border-color: rgba(255,255,255,.16); }')
          s=s.replace('dark:text-gray-400', 'dark:text-gray-300')
          s=s.replace('dark:bg-white/10 dark:text-gray-400', 'dark:bg-white/15 dark:text-gray-200')
          s=s.replace('dark:border-white/10 dark:bg-white/5 dark:text-white', 'dark:border-white/25 dark:bg-white/10 dark:text-white dark:placeholder:text-gray-300')
          s=s.replace('text-gray-500 md:text-[10px]', 'text-gray-500 dark:text-gray-300 md:text-[10px]')
          s=s.replace('text-[10px] text-gray-500 md:text-xs', 'text-[10px] text-gray-500 dark:text-gray-300 md:text-xs')
          s=s.replace('text-[10px] text-gray-500 md:px-2', 'text-[10px] text-gray-500 dark:text-gray-300 md:px-2')
          p.write_text(s)
          PY
      - name: Build
        run: npm ci && npm run build
      - name: Commit and deploy
        run: |
          git config user.name 'Ebuka Ben Umeh'
          git config user.email 'ebuka.umeh40@outlook.com'
          git add client/src/pages/global-landing.tsx
          git commit -m 'Restore rotating Earth texture and improve dark contrast'
          git push
