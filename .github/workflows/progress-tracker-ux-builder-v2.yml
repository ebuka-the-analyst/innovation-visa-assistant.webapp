name: Progress Tracker UX Builder V2

on:
  push:
    branches:
      - ux/progress-tracker-production-usability
    paths:
      - .github/workflows/progress-tracker-ux-builder-v2.yml
      - scripts/fix-progress-ux-patcher.py

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ux/progress-tracker-production-usability
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Fix staging patcher
        run: python3 scripts/fix-progress-ux-patcher.py

      - name: Apply production UX patch
        run: python3 scripts/apply-progress-tracker-production-ux.py

      - name: Install and lock browser-test dependencies
        run: |
          npm install --save-dev @playwright/test @axe-core/playwright
          npm pkg set 'scripts.test:e2e:progress=playwright test tests/e2e/progress-tracker.spec.ts --project=chromium'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Progress Tracker browser regression suite
        run: npm run test:e2e:progress

      - name: Run existing Progress Tracker regression checks
        run: |
          node scripts/validate-progress-tracker-plan-link.cjs
          node scripts/validate-evidence-aware-progress-tracker.cjs

      - name: Production build
        run: npm run build

      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/progress.tsx client/src/components/FeatureNavigation.tsx package.json package-lock.json playwright.config.ts tests/e2e/progress-tracker.spec.ts client/progress-e2e.html client/src/__e2e__/progress-harness.tsx
          if git diff --cached --quiet; then
            echo 'No generated implementation changes to commit.'
            exit 0
          fi
          git commit -m 'Upgrade Progress Tracker production UX and browser tests'
          git push origin HEAD:ux/progress-tracker-production-usability
