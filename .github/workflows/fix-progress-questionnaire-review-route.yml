name: Fix completed questionnaire review route

on:
  push:
    branches:
      - fix/progress-questionnaire-review-route
    paths:
      - .github/workflows/fix-progress-questionnaire-review-route.yml

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/progress-questionnaire-review-route
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply questionnaire review routing fix
        run: python3 scripts/apply-progress-questionnaire-review-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Progress Tracker browser regressions
        run: npm run test:e2e:progress

      - name: Run Progress Tracker semantic regressions
        run: |
          node scripts/validate-progress-tracker-plan-link.cjs
          node scripts/validate-evidence-aware-progress-tracker.cjs

      - name: Production build
        run: npm run build

      - name: Commit validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/progress.tsx tests/e2e/progress-tracker.spec.ts scripts/validate-progress-tracker-plan-link.cjs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No validated changes to commit.'
            exit 0
          fi
          git commit -m 'Fix completed questionnaire review routing'
          git push origin HEAD:fix/progress-questionnaire-review-route
